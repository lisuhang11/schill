apiVersion: v1
kind: Service
metadata:
  name: relation-rpc
spec:
  selector:
    app: relation-rpc
  ports:
    - name: rpc
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relation-rpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relation-rpc
  template:
    metadata:
      labels:
        app: relation-rpc
    spec:
      containers:
        - name: relation-rpc
          image: schill-relation-rpc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: dev
          ports:
            - containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: schill-app-config
