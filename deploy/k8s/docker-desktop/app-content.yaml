apiVersion: v1
kind: Service
metadata:
  name: content-rpc
spec:
  selector:
    app: content-rpc
  ports:
    - name: rpc
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-rpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-rpc
  template:
    metadata:
      labels:
        app: content-rpc
    spec:
      containers:
        - name: content-rpc
          image: schill-content-rpc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: dev
          ports:
            - containerPort: 8082
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 600m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: schill-app-config
