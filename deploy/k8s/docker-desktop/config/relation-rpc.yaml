Name: relation.rpc
ListenOn: 0.0.0.0:8081
Etcd:
  Hosts:
    - etcd:2379
  Key: relation.rpc

UserRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: user.rpc

Mysql:
  DataSource: "root:123456@tcp(mysql:3306)/schill?parseTime=true&loc=UTC"
  AutoMigrate: true

KqPusherConf:
  Brokers:
    - kafka:9092
  TopicFollowed: user-followed
  TopicUnfollowed: user-unfollowed

Cache:
  - Host: redis:6379
    Type: node
    Pass: ""
