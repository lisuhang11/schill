apiVersion: v1
kind: Service
metadata:
  name: comment-rpc
spec:
  selector:
    app: comment-rpc
  ports:
    - name: rpc
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comment-rpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comment-rpc
  template:
    metadata:
      labels:
        app: comment-rpc
    spec:
      containers:
        - name: comment-rpc
          image: schill-comment-rpc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: dev
          ports:
            - containerPort: 8083
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 600m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: schill-app-config
