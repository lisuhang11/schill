apiVersion: v1
kind: Service
metadata:
  name: search-api
spec:
  selector:
    app: search-api
  ports:
    - name: http
      port: 8895
      targetPort: 8895
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
    spec:
      containers:
        - name: search-api
          image: schill-search-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8895
          readinessProbe:
            tcpSocket:
              port: 8895
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8895
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: schill-app-config
