apiVersion: v1
kind: Service
metadata:
  name: canal-sync
spec:
  selector:
    app: canal-sync
  ports:
    - name: http
      port: 8088
      targetPort: 8088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canal-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canal-sync
  template:
    metadata:
      labels:
        app: canal-sync
    spec:
      containers:
        - name: canal-sync
          image: schill-canal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          readinessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: schill-app-config
