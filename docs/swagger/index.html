<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Schill API 文档</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
        }
        .header h1 { margin-bottom: 10px; }
        .nav {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .nav button {
            padding: 8px 20px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .nav button:hover, .nav button.active {
            background: white;
            color: #667eea;
        }
        #swagger-ui { padding: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔌 Schill API 文档</h1>
        <p>基于 go-zero 框架的微服务 API 文档</p>
        <div class="nav">
            <button class="active" onclick="loadSpec('comment.json')">评论服务</button>
            <button onclick="loadSpec('content.json')">内容服务</button>
            <button onclick="loadSpec('interaction.json')">互动服务</button>
            <button onclick="loadSpec('relation.json')">关系服务</button>
        </div>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        let ui;
        
        function loadSpec(url) {
            // 更新按钮状态
            document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 如果 UI 已存在，销毁它
            if (ui) {
                ui.destroy();
            }
            
            // 初始化 Swagger UI
            ui = SwaggerUIBundle({
                url: url,
                domNode: document.getElementById('swagger-ui'),
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                displayRequestDuration: true,
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                filter: true,
                showCommonExtensions: true,
                syntaxHighlight: {
                    activate: true,
                    theme: "monokai"
                },
                tryItOutEnabled: false
            });
        }
        
        // 默认加载评论服务
        window.onload = function() {
            loadSpec('comment.json');
        };
    </script>
</body>
</html>
