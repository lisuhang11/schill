Name: gateway
Host: 0.0.0.0
Port: 8086

Jwt:
  AccessSecret: "change-me-gateway-access-secret"

# Distributed rate limiting using go-zero PeriodLimit + Redis.
# Redis is used for cross-instance consistency; remove the Redis block to
# fall back to local in-memory rate limiting (single instance only).
RateLimit:
  Redis:
    Host: 127.0.0.1:6379
    Type: node
    Pass: ""
  # Auth endpoints: register / login / refresh-token
  # 20 requests per 60 seconds per IP — prevents brute-force and abuse.
  Auth:
    PeriodSec: 60
    Quota: 20
  # Write endpoints: create/update/delete/vote/follow/star/collect/share
  # 30 requests per 60 seconds per IP — prevents spammy writes.
  Write:
    PeriodSec: 60
    Quota: 30
  # Read endpoints: get/list/feed
  # 200 requests per 60 seconds per IP — generous for browsing.
  Read:
    PeriodSec: 60
    Quota: 200
  # Search endpoints: stricter to protect Elasticsearch from overload.
  # 30 requests per 60 seconds per IP.
  Search:
    PeriodSec: 60
    Quota: 30

UserRpc:
  Target: 127.0.0.1:8080

ContentRpc:
  Target: 127.0.0.1:8082

FeedRpc:
  Target: 127.0.0.1:8087

CommentRpc:
  Target: 127.0.0.1:8083

RelationRpc:
  Target: 127.0.0.1:8081

InteractionRpc:
  Target: 127.0.0.1:8084

SearchRpc:
  Target: 127.0.0.1:8088
