Name: comment.rpc
ListenOn: 0.0.0.0:8083
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: comment.rpc

ContentRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: content.rpc

Mysql:
  DataSource: "root:123456@tcp(127.0.0.1:3306)/schill?parseTime=true&loc=UTC"
  MaxOpenConns: 100
  MaxIdleConns: 20
  ConnMaxLifetime: 600
  ConnMaxIdleTime: 300

KqProducerConf:
  Brokers:
    - 127.0.0.1:9092
  TopicCommentCreate: comment-create
  TopicCommentCreated: comment-created
  TopicCommentDeleted: comment-deleted
  TopicCommentVote: comment-vote

KqConsumerConf:
  Brokers:
    - 127.0.0.1:9092
  TopicCommentCreate: comment-create
  TopicCommentDeleted: comment-deleted
  TopicCommentVote: comment-vote
  TopicCommentDLQ: comment-dlq
  Group: comment-consumer-group

RedisConf:
  Host: "127.0.0.1"
  Port: "6379"
  Password: ""
  DB: 0

Cache:
  - Host: "127.0.0.1:6379"
    Pass: ""
